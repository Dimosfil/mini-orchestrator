<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Настройка агентов</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f9;
      --surface: #ffffff;
      --panel: #fdfefe;
      --line: #d4dde6;
      --line-strong: #9fafbf;
      --text: #1c2630;
      --muted: #617183;
      --accent: #256f6c;
      --accent-strong: #184f4d;
      --accent-soft: #dff1ef;
      --blue: #2f6690;
      --amber: #a06100;
      --danger: #b13b3b;
      --shadow: 0 14px 34px rgba(26, 39, 52, 0.12);
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 11px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .shell {
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-strong);
    }

    .btn-secondary {
      border-color: var(--line-strong);
      background: #ffffff;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #eef3f6;
    }

    .btn-danger {
      border-color: #d4a1a1;
      background: #fff8f8;
      color: var(--danger);
    }

    .workspace {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 0;
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
    }

    .section {
      display: grid;
      gap: 10px;
    }

    .section h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0;
    }

    .control-grid {
      display: grid;
      gap: 9px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fbfcfd;
      color: var(--text);
      outline: none;
    }

    select,
    input {
      min-height: 36px;
      padding: 7px 9px;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      padding: 10px;
      line-height: 1.4;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .palette {
      display: grid;
      gap: 8px;
    }

    .palette button {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      text-align: left;
      border-color: var(--line);
      background: #ffffff;
      color: var(--text);
      font-weight: 700;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--accent);
    }

    .swatch.executor {
      background: var(--blue);
    }

    .swatch.reviewer {
      background: var(--amber);
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(#e7edf2 1px, transparent 1px),
        linear-gradient(90deg, #e7edf2 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 58px);
    }

    .connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }

    .agent-card {
      position: absolute;
      z-index: 2;
      width: 260px;
      min-height: 142px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      user-select: none;
    }

    .agent-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      cursor: grab;
    }

    .card-head:active {
      cursor: grabbing;
    }

    .agent-name {
      width: 150px;
      border: 0;
      border-radius: 4px;
      min-height: 28px;
      padding: 4px 6px;
      background: transparent;
      font-weight: 800;
    }

    .agent-role {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .card-body {
      display: grid;
      gap: 10px;
      padding: 11px 12px 12px;
    }

    .agent-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      min-height: 34px;
      padding-top: 2px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .agent-menu-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      min-height: 28px;
      border: 0;
      border-radius: 6px;
      padding: 4px 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .agent-menu-button:hover,
    .agent-menu-button.active {
      background: #eef3f6;
      color: var(--text);
    }

    .agent-menu-button .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar-icon {
      width: 24px;
      min-height: 28px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
    }

    .agent-popover {
      position: absolute;
      left: 48px;
      top: 112px;
      z-index: 6;
      display: grid;
      gap: 3px;
      width: 210px;
      padding: 9px 7px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      background: #2a2a2a;
      color: #ffffff;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.32);
    }

    .agent-popover.model {
      left: 258px;
      top: 84px;
      width: 200px;
    }

    .menu-heading {
      padding: 2px 7px 6px;
      color: #aeb0b4;
      font-size: 12px;
      font-weight: 700;
    }

    .menu-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 18px;
      align-items: center;
      min-height: 28px;
      border: 0;
      border-radius: 7px;
      padding: 5px 7px;
      background: transparent;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
    }

    .menu-option:hover,
    .menu-option.active {
      background: #444444;
    }

    .menu-option .check {
      color: #d2d3d7;
      text-align: right;
    }

    .menu-divider {
      height: 1px;
      margin: 3px 4px;
      background: #444444;
    }

    .menu-option.with-submenu {
      grid-template-columns: minmax(0, 1fr) 14px;
    }

    .port {
      position: absolute;
      top: 50%;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-strong);
      transform: translateY(-50%);
      cursor: crosshair;
    }

    .port.input {
      left: -8px;
      background: var(--blue);
    }

    .port.output {
      right: -8px;
    }

    .port.active {
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      pointer-events: none;
      z-index: 0;
    }

    .empty-state span {
      padding: 10px 14px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
    }

    .status-line {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .shell {
        min-height: 100vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        flex-wrap: wrap;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .canvas {
        min-height: 680px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title">
        <h1>Настройка агентов</h1>
        <div class="subtitle">Соберите флоу из карточек агентов, настройте LLM и соедините шаги стрелками.</div>
      </div>
      <div class="actions">
        <button id="save-flow" class="btn-primary" type="button">Сохранить</button>
        <button id="reset-flow" class="btn-danger" type="button">Очистить</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="sidebar" aria-label="Контролы конструктора">
        <section class="section">
          <h2>Добавить агента</h2>
          <div class="palette">
            <button type="button" data-add-agent="Planner"><span class="swatch"></span><span>Planner</span></button>
            <button type="button" data-add-agent="Executor"><span class="swatch executor"></span><span>Executor</span></button>
            <button type="button" data-add-agent="Reviewer"><span class="swatch reviewer"></span><span>Reviewer</span></button>
          </div>
        </section>

        <section class="section">
          <h2>Настройки нового агента</h2>
          <div class="control-grid">
            <div class="field">
              <label for="default-llm">LLM</label>
              <select id="default-llm">
                <option value="gpt-5.5">GPT-5.5</option>
                <option value="gpt-5.4">GPT-5.4</option>
                <option value="gpt-5.4-mini">GPT-5.4-Mini</option>
                <option value="gpt-5.3-codex-spark">GPT-5.3-Codex-Spark</option>
                <option value="gpt-5-mini">gpt-5-mini</option>
                <option value="gpt-5">gpt-5</option>
                <option value="gpt-4.1-mini">gpt-4.1-mini</option>
                <option value="rules">rules fallback</option>
              </select>
            </div>
            <div class="field">
              <label for="default-speed">Скорость</label>
              <select id="default-speed">
                <option value="fast">Быстро</option>
                <option value="balanced">Средне</option>
                <option value="careful">Аккуратно</option>
              </select>
            </div>
            <div class="field">
              <label for="default-reasoning">Уровень размышления</label>
              <select id="default-reasoning">
                <option value="low">Низкий</option>
                <option value="medium">Средний</option>
                <option value="high">Высокий</option>
                <option value="very_high">Очень высокий</option>
              </select>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>JSON флоу</h2>
          <textarea id="flow-json" spellcheck="false" readonly></textarea>
          <div class="status-line" id="status-line">Флоу хранится локально в браузере.</div>
        </section>
      </aside>

      <section class="canvas-wrap" aria-label="Рабочее поле флоу">
        <div id="canvas" class="canvas">
          <svg id="connections" class="connections" aria-hidden="true">
            <defs>
              <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="#256f6c"></path>
              </marker>
            </defs>
          </svg>
          <div id="empty-state" class="empty-state"><span>Добавьте агента слева, затем соедините точки на карточках.</span></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "mini-orchestrator-agent-flow-v1";
    const canvas = document.querySelector("#canvas");
    const svg = document.querySelector("#connections");
    const emptyState = document.querySelector("#empty-state");
    const flowJson = document.querySelector("#flow-json");
    const defaultLlm = document.querySelector("#default-llm");
    const defaultSpeed = document.querySelector("#default-speed");
    const defaultReasoning = document.querySelector("#default-reasoning");
    const statusLine = document.querySelector("#status-line");
    let selectedAgentId = "";
    let dragState = null;
    let linkState = null;

    const flow = loadFlow();

    function loadFlow() {
      const fallback = {
        agents: [],
        connections: [],
        nextAgentNumber: 1,
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return fallback;
        }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.agents) || !Array.isArray(parsed.connections)) {
          return fallback;
        }
        return {
          agents: parsed.agents,
          connections: parsed.connections,
          nextAgentNumber: Number(parsed.nextAgentNumber || parsed.agents.length + 1),
        };
      } catch {
        return fallback;
      }
    }

    function persistFlow(message = "Сохранено локально.") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(flow));
      flowJson.value = JSON.stringify(flow, null, 2);
      statusLine.textContent = message;
    }

    function cardColor(role) {
      if (role === "Executor") {
        return "#2f6690";
      }
      if (role === "Reviewer") {
        return "#a06100";
      }
      return "#256f6c";
    }

    function addAgent(role) {
      const count = flow.nextAgentNumber++;
      const agent = {
        id: `agent-${Date.now()}-${count}`,
        name: `${role} ${count}`,
        role,
        llm: defaultLlm.value,
        speed: defaultSpeed.value,
        reasoning: defaultReasoning.value,
        x: 360 + (count % 3) * 42,
        y: 90 + (count % 4) * 54,
      };
      flow.agents.push(agent);
      selectedAgentId = agent.id;
      render();
      persistFlow("Агент добавлен.");
    }

    function removeBrokenConnections() {
      const ids = new Set(flow.agents.map((agent) => agent.id));
      flow.connections = flow.connections.filter((connection) => ids.has(connection.fromAgentId) && ids.has(connection.toAgentId));
    }

    function getAgent(id) {
      return flow.agents.find((agent) => agent.id === id);
    }

    function updateAgent(id, patch) {
      const agent = getAgent(id);
      if (!agent) {
        return;
      }
      Object.assign(agent, patch);
      renderConnections();
      persistFlow("Настройки агента обновлены.");
    }

    function render() {
      canvas.querySelectorAll(".agent-card").forEach((node) => node.remove());
      emptyState.hidden = flow.agents.length > 0;
      removeBrokenConnections();
      for (const agent of flow.agents) {
        canvas.append(renderAgentCard(agent));
      }
      renderConnections();
      persistFlow("Флоу готов.");
    }

    function renderAgentCard(agent) {
      const card = document.createElement("article");
      card.className = `agent-card ${selectedAgentId === agent.id ? "selected" : ""}`;
      card.dataset.agentId = agent.id;
      card.style.left = `${agent.x}px`;
      card.style.top = `${agent.y}px`;
      card.style.borderTop = `4px solid ${cardColor(agent.role)}`;

      const inputPort = document.createElement("button");
      inputPort.className = "port input";
      inputPort.type = "button";
      inputPort.title = "Вход агента";
      inputPort.dataset.port = "input";
      inputPort.dataset.agentId = agent.id;

      const outputPort = document.createElement("button");
      outputPort.className = "port output";
      outputPort.type = "button";
      outputPort.title = "Выход агента";
      outputPort.dataset.port = "output";
      outputPort.dataset.agentId = agent.id;

      const head = document.createElement("header");
      head.className = "card-head";
      const name = document.createElement("input");
      name.className = "agent-name";
      name.value = agent.name;
      name.ariaLabel = "Имя агента";
      name.addEventListener("input", () => updateAgent(agent.id, { name: name.value }));
      const role = document.createElement("span");
      role.className = "agent-role";
      role.textContent = agent.role;
      head.append(name, role);

      const body = document.createElement("div");
      body.className = "card-body";
      body.append(
        selectField("LLM", agent.llm, [
          ["gpt-5.5", "GPT-5.5"],
          ["gpt-5.4", "GPT-5.4"],
          ["gpt-5.4-mini", "GPT-5.4-Mini"],
          ["gpt-5.3-codex-spark", "GPT-5.3-Codex-Spark"],
          ["gpt-5-mini", "gpt-5-mini"],
          ["gpt-5", "gpt-5"],
          ["gpt-4.1-mini", "gpt-4.1-mini"],
          ["rules", "rules fallback"],
        ], (value) => updateAgent(agent.id, { llm: value })),
        selectField("Скорость LLM", agent.speed, [
          ["fast", "Быстро"],
          ["balanced", "Средне"],
          ["careful", "Аккуратно"],
        ], (value) => updateAgent(agent.id, { speed: value })),
        selectField("Размышление", agent.reasoning, [
          ["low", "Низкий"],
          ["medium", "Средний"],
          ["high", "Высокий"],
          ["very_high", "Очень высокий"],
        ], (value) => updateAgent(agent.id, { reasoning: value })),
      );

      card.append(inputPort, outputPort, head, body);
      card.addEventListener("pointerdown", () => {
        selectedAgentId = agent.id;
        document.querySelectorAll(".agent-card").forEach((node) => node.classList.toggle("selected", node.dataset.agentId === agent.id));
      });
      head.addEventListener("pointerdown", (event) => startDrag(event, agent.id));
      outputPort.addEventListener("pointerdown", (event) => startLink(event, agent.id));
      inputPort.addEventListener("pointerup", (event) => finishLink(event, agent.id));
      return card;
    }

    function selectField(labelText, value, values, onChange) {
      const wrapper = document.createElement("label");
      wrapper.className = "field";
      const caption = document.createElement("span");
      caption.textContent = labelText;
      const select = document.createElement("select");
      for (const item of values) {
        const optionValue = Array.isArray(item) ? item[0] : item;
        const optionLabel = Array.isArray(item) ? item[1] : item;
        const option = document.createElement("option");
        option.value = optionValue;
        option.textContent = optionLabel;
        option.selected = optionValue === value;
        select.append(option);
      }
      select.addEventListener("change", () => onChange(select.value));
      wrapper.append(caption, select);
      return wrapper;
    }

    function startDrag(event, agentId) {
      if (event.target.closest("input, select, button")) {
        return;
      }
      const agent = getAgent(agentId);
      if (!agent) {
        return;
      }
      event.preventDefault();
      const rect = canvas.getBoundingClientRect();
      dragState = {
        agentId,
        offsetX: event.clientX - rect.left - agent.x,
        offsetY: event.clientY - rect.top - agent.y,
      };
      canvas.setPointerCapture(event.pointerId);
    }

    function moveDrag(event) {
      if (!dragState) {
        return;
      }
      const agent = getAgent(dragState.agentId);
      if (!agent) {
        return;
      }
      const rect = canvas.getBoundingClientRect();
      agent.x = Math.max(12, Math.min(rect.width - 280, event.clientX - rect.left - dragState.offsetX));
      agent.y = Math.max(12, Math.min(rect.height - 236, event.clientY - rect.top - dragState.offsetY));
      const card = canvas.querySelector(`[data-agent-id="${agent.id}"]`);
      if (card) {
        card.style.left = `${agent.x}px`;
        card.style.top = `${agent.y}px`;
      }
      renderConnections();
      flowJson.value = JSON.stringify(flow, null, 2);
    }

    function endDrag() {
      if (!dragState) {
        return;
      }
      dragState = null;
      persistFlow("Позиция агента сохранена.");
    }

    function startLink(event, agentId) {
      event.preventDefault();
      event.stopPropagation();
      selectedAgentId = agentId;
      linkState = {
        fromAgentId: agentId,
        pointer: pointerPoint(event),
      };
      document.querySelectorAll(".port").forEach((port) => port.classList.toggle("active", port.dataset.agentId === agentId && port.dataset.port === "output"));
      renderConnections();
      window.addEventListener("pointerup", cancelLink, { once: true });
    }

    function finishLink(event, toAgentId) {
      if (!linkState) {
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      const fromAgentId = linkState.fromAgentId;
      if (fromAgentId !== toAgentId) {
        const exists = flow.connections.some((connection) => connection.fromAgentId === fromAgentId && connection.toAgentId === toAgentId);
        if (!exists) {
          flow.connections.push({
            id: `connection-${Date.now()}`,
            fromAgentId,
            toAgentId,
            fromPort: "output",
            toPort: "input",
          });
        }
      }
      linkState = null;
      document.querySelectorAll(".port").forEach((port) => port.classList.remove("active"));
      renderConnections();
      persistFlow("Связь добавлена.");
    }

    function cancelLink() {
      if (!linkState) {
        return;
      }
      linkState = null;
      document.querySelectorAll(".port").forEach((port) => port.classList.remove("active"));
      renderConnections();
      persistFlow("Соединение отменено.");
    }

    function pointerPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top,
      };
    }

    function portPoint(agentId, port) {
      const card = canvas.querySelector(`.agent-card[data-agent-id="${agentId}"]`);
      if (!card) {
        return { x: 0, y: 0 };
      }
      const cardRect = card.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const x = port === "output" ? cardRect.right - canvasRect.left : cardRect.left - canvasRect.left;
      const y = cardRect.top - canvasRect.top + cardRect.height / 2;
      return { x, y };
    }

    function connectionPath(from, to) {
      const distance = Math.max(70, Math.abs(to.x - from.x) * 0.5);
      return `M ${from.x} ${from.y} C ${from.x + distance} ${from.y}, ${to.x - distance} ${to.y}, ${to.x} ${to.y}`;
    }

    function renderConnections() {
      svg.querySelectorAll("path.connection, path.preview").forEach((node) => node.remove());
      for (const connection of flow.connections) {
        const from = portPoint(connection.fromAgentId, "output");
        const to = portPoint(connection.toAgentId, "input");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "connection");
        path.setAttribute("d", connectionPath(from, to));
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#256f6c");
        path.setAttribute("stroke-width", "2.5");
        path.setAttribute("marker-end", "url(#arrow-head)");
        svg.append(path);
      }
      if (linkState) {
        const from = portPoint(linkState.fromAgentId, "output");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "preview");
        path.setAttribute("d", connectionPath(from, linkState.pointer));
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#617183");
        path.setAttribute("stroke-width", "2");
        path.setAttribute("stroke-dasharray", "7 5");
        path.setAttribute("marker-end", "url(#arrow-head)");
        svg.append(path);
      }
    }

    function saveFlow() {
      persistFlow("Флоу сохранен в localStorage.");
    }

    function resetFlow() {
      if (!window.confirm("Очистить текущий флоу агентов?")) {
        return;
      }
      flow.agents = [];
      flow.connections = [];
      flow.nextAgentNumber = 1;
      selectedAgentId = "";
      localStorage.removeItem(STORAGE_KEY);
      render();
      persistFlow("Флоу очищен.");
    }

    document.querySelectorAll("[data-add-agent]").forEach((button) => {
      button.addEventListener("click", () => addAgent(button.dataset.addAgent));
    });
    document.querySelector("#save-flow").addEventListener("click", saveFlow);
    document.querySelector("#reset-flow").addEventListener("click", resetFlow);
    canvas.addEventListener("pointermove", (event) => {
      moveDrag(event);
      if (linkState) {
        linkState.pointer = pointerPoint(event);
        renderConnections();
      }
    });
    canvas.addEventListener("pointerup", endDrag);
    window.addEventListener("resize", renderConnections);
    render();
  </script>
</body>
</html>
