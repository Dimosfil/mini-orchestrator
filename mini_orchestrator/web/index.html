<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Orchestrator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-muted: #eef2f5;
      --line: #d6dde5;
      --line-strong: #aeb9c5;
      --text: #1d252d;
      --muted: #617080;
      --accent: #256f6c;
      --accent-strong: #195553;
      --accent-soft: #e0f0ee;
      --ok: #217a46;
      --warn: #946200;
      --danger: #b13b3b;
      --code: #111827;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .page {
      width: min(1360px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      line-height: 1.4;
      max-width: 760px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      flex: 0 0 auto;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--line-strong);
    }

    .dot.ok {
      background: var(--ok);
    }

    .dot.busy {
      background: var(--warn);
    }

    .dot.error {
      background: var(--danger);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .panel-body {
      padding: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 10px 11px;
      background: #fbfcfd;
      color: var(--text);
      line-height: 1.45;
      outline: none;
    }

    textarea:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-strong);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text);
      border-color: var(--line-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-muted);
    }

    .btn-wide {
      grid-column: 1 / -1;
    }

    .run-controls {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .metric {
      min-height: 72px;
      padding: 13px 14px;
      border-right: 1px solid var(--line);
    }

    .metric:last-child {
      border-right: 0;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .metric-value {
      font-size: 15px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 16px 0;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      min-height: 34px;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
      background: var(--surface-muted);
      color: var(--muted);
    }

    .tab.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--line-strong);
    }

    .view {
      display: none;
      padding: 16px;
    }

    .view.active {
      display: block;
    }

    .output {
      margin: 0;
      min-height: 280px;
      max-height: 560px;
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f1720;
      color: #edf3f8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      font-size: 13px;
      font-family: Consolas, "Cascadia Mono", monospace;
    }

    .agent-list {
      display: grid;
      gap: 12px;
    }

    .agent {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      overflow: hidden;
    }

    .agent h3 {
      margin: 0;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      text-transform: capitalize;
    }

    .agent pre {
      margin: 0;
      padding: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
      color: var(--code);
      font-size: 13px;
      font-family: Consolas, "Cascadia Mono", monospace;
    }

    .empty {
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      text-align: center;
      padding: 18px;
      line-height: 1.45;
    }

    .toast {
      margin-top: 12px;
      min-height: 40px;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fbfcfd;
      line-height: 1.4;
    }

    .toast.ok {
      border-color: #9bc7ad;
      color: var(--ok);
      background: #edf8f1;
    }

    .toast.error {
      border-color: #e2aaaa;
      color: var(--danger);
      background: #fff1f1;
    }

    @media (max-width: 860px) {
      .page {
        padding: 14px;
      }

      .topbar,
      .layout {
        grid-template-columns: 1fr;
        display: grid;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }

      .metric:nth-child(2) {
        border-right: 0;
      }

      .metric:nth-child(-n + 2) {
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 520px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .metric {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .metric:last-child {
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>Mini Orchestrator</h1>
        <p class="subtitle">Планирование, подтверждение и локальный прогон демо-проекта через dispatcher.</p>
      </div>
      <div class="topbar-actions">
        <button id="agents-builder-button" class="btn-secondary" type="button">Настройка агентов</button>
        <div class="status-pill" aria-live="polite">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">Готов</span>
        </div>
      </div>
    </header>

    <section class="layout">
      <form id="task-form" class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Задача</h2>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="task">Команда</label>
            <textarea id="task" spellcheck="false">оркестратор план Сделай калькулятор</textarea>
          </div>

          <div class="controls">
            <button id="plan-button" class="btn-primary" type="submit">План</button>
            <button id="core-button" class="btn-secondary" type="button">Core run</button>
          </div>

          <div class="run-controls">
            <label class="check-row">
              <input id="approval" type="checkbox" />
              <span>План подтвержден</span>
            </label>
            <button id="run-button" class="btn-primary btn-wide" type="button" disabled>Запустить workflow</button>
          </div>

          <div id="message" class="toast">Ожидаю задачу.</div>
        </div>
      </form>

      <section class="panel">
        <div class="summary-grid">
          <div class="metric">
            <div class="metric-label">Статус</div>
            <div id="metric-status" class="metric-value">idle</div>
          </div>
          <div class="metric">
            <div class="metric-label">Режим</div>
            <div id="metric-mode" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Роль</div>
            <div id="metric-role" class="metric-value">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Лог</div>
            <div id="metric-log" class="metric-value">-</div>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Output views">
          <button class="tab active" type="button" data-tab="plan">План</button>
          <button class="tab" type="button" data-tab="agents">Агенты</button>
          <button class="tab" type="button" data-tab="json">JSON</button>
        </div>

        <div id="view-plan" class="view active">
          <div id="plan-empty" class="empty">План появится здесь.</div>
          <pre id="plan-output" class="output" hidden></pre>
        </div>

        <div id="view-agents" class="view">
          <div id="agents-empty" class="empty">Результаты агентов появятся здесь.</div>
          <div id="agents-output" class="agent-list" hidden></div>
        </div>

        <div id="view-json" class="view">
          <pre id="json-output" class="output">{}</pre>
        </div>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector("#task-form");
    const agentsBuilderButton = document.querySelector("#agents-builder-button");
    const taskInput = document.querySelector("#task");
    const planButton = document.querySelector("#plan-button");
    const coreButton = document.querySelector("#core-button");
    const runButton = document.querySelector("#run-button");
    const approval = document.querySelector("#approval");
    const message = document.querySelector("#message");
    const statusDot = document.querySelector("#status-dot");
    const statusText = document.querySelector("#status-text");
    const metricStatus = document.querySelector("#metric-status");
    const metricMode = document.querySelector("#metric-mode");
    const metricRole = document.querySelector("#metric-role");
    const metricLog = document.querySelector("#metric-log");
    const planEmpty = document.querySelector("#plan-empty");
    const planOutput = document.querySelector("#plan-output");
    const agentsEmpty = document.querySelector("#agents-empty");
    const agentsOutput = document.querySelector("#agents-output");
    const jsonOutput = document.querySelector("#json-output");
    let lastPlanTask = "";
    let busy = false;

    function setBusy(nextBusy, label = "Работаю") {
      busy = nextBusy;
      planButton.disabled = busy;
      coreButton.disabled = busy;
      runButton.disabled = busy || !approval.checked || !lastPlanTask;
      statusDot.className = `dot ${busy ? "busy" : ""}`;
      statusText.textContent = busy ? label : "Готов";
    }

    function setMessage(text, kind = "") {
      message.textContent = text;
      message.className = `toast ${kind}`.trim();
    }

    function activeTab(name) {
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.tab === name);
      });
      document.querySelectorAll(".view").forEach((view) => {
        view.classList.toggle("active", view.id === `view-${name}`);
      });
    }

    function textOf(value) {
      if (value === null || value === undefined) {
        return "-";
      }
      if (typeof value === "string") {
        return value || "-";
      }
      return JSON.stringify(value, null, 2);
    }

    function updateSummary(payload) {
      metricStatus.textContent = textOf(payload.status);
      metricMode.textContent = textOf(payload.mode || payload.state);
      metricRole.textContent = textOf(payload.dispatchDecision?.role || payload.model);
      metricLog.textContent = textOf(payload.log || payload.run_id);
    }

    function renderPayload(payload) {
      updateSummary(payload);
      jsonOutput.textContent = JSON.stringify(payload, null, 2);

      const plannerText = payload.agents?.planner || payload.result?.tool_output || payload.result?.plan_rationale || "";
      planOutput.textContent = plannerText;
      planOutput.hidden = !plannerText;
      planEmpty.hidden = Boolean(plannerText);

      agentsOutput.innerHTML = "";
      const agents = payload.agents || {};
      const agentNames = Object.keys(agents);
      if (agentNames.length) {
        for (const name of agentNames) {
          const item = document.createElement("section");
          item.className = "agent";
          const title = document.createElement("h3");
          title.textContent = name;
          const pre = document.createElement("pre");
          pre.textContent = textOf(agents[name]);
          item.append(title, pre);
          agentsOutput.append(item);
        }
      }
      agentsOutput.hidden = agentNames.length === 0;
      agentsEmpty.hidden = agentNames.length > 0;
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = payload.error?.message || payload.error || response.statusText;
        throw new Error(detail);
      }
      return payload;
    }

    async function createPlan(event) {
      event?.preventDefault();
      const task = taskInput.value.trim();
      if (!task) {
        setMessage("Введите задачу.", "error");
        return;
      }

      setBusy(true, "Планирую");
      setMessage("Запрашиваю план...");
      try {
        const payload = await postJson("/api/dispatcher/plan", { task });
        lastPlanTask = task;
        approval.checked = false;
        renderPayload(payload);
        activeTab("plan");
        setMessage("План готов.", "ok");
      } catch (error) {
        statusDot.className = "dot error";
        setMessage(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    async function runApprovedWorkflow() {
      if (!lastPlanTask || !approval.checked) {
        setMessage("Подтвердите план перед запуском.", "error");
        return;
      }

      setBusy(true, "Запускаю");
      setMessage("Выполняю approved workflow...");
      try {
        const payload = await postJson("/api/dispatcher/run", {
          task: lastPlanTask,
          approved: true,
        });
        renderPayload(payload);
        activeTab("agents");
        setMessage("Workflow завершен.", "ok");
      } catch (error) {
        statusDot.className = "dot error";
        setMessage(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    async function runCoreOrchestrator() {
      const goal = taskInput.value.trim();
      if (!goal) {
        setMessage("Введите задачу.", "error");
        return;
      }

      setBusy(true, "Выполняю");
      setMessage("Запускаю core orchestrator...");
      try {
        const payload = await postJson("/api/run", { goal });
        renderPayload(payload);
        activeTab("json");
        setMessage("Core run завершен.", payload.status === "done" ? "ok" : "");
      } catch (error) {
        statusDot.className = "dot error";
        setMessage(error.message, "error");
      } finally {
        setBusy(false);
      }
    }

    form.addEventListener("submit", createPlan);
    agentsBuilderButton.addEventListener("click", () => {
      window.open("/agents-builder", "mini-orchestrator-agents-builder");
    });
    runButton.addEventListener("click", runApprovedWorkflow);
    coreButton.addEventListener("click", runCoreOrchestrator);
    approval.addEventListener("change", () => {
      runButton.disabled = busy || !approval.checked || !lastPlanTask;
    });
    taskInput.addEventListener("input", () => {
      lastPlanTask = "";
      approval.checked = false;
      runButton.disabled = true;
    });
    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => activeTab(tab.dataset.tab));
    });
  </script>
</body>
</html>
